name: public-validator-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SWI-Prolog and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          python -m pip install --upgrade pytest
      - name: Run regression and integration tests
        run: python -m pytest -q
      - name: Run validator demo
        run: python -m scripts.demo_validator
